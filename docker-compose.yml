services:
  postgres:
    image: postgres:18
    container_name: gym-crm-postgres
    environment:
      POSTGRES_DB: gym_crm
      POSTGRES_USER: gym_user
      POSTGRES_PASSWORD: gym_password
    ports:
      - "5432:5432"
    volumes:
      - gym_crm_pgdata:/var/lib/postgresql/data

volumes:
  gym_crm_pgdata: